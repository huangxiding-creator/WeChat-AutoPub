; ============================================================
; WeChat-AutoPub 配置模板
; 使用方法：复制本文件为 config.ini，填入你自己的 Key 和 Webhook
; ============================================================

[账号]
单账号单日最大发布数 = 20
登录等待扫码超时分钟 = 30

[草稿]
发布最近天数 = 3
每篇间隔最小秒 = 90
每篇间隔最大秒 = 150
选择弹窗等待秒 = 25
安静期秒 = 8
空轮重试上限 = 2
贴图渲染宽限秒 = 8

[贴图]
翻页数 = 5
草稿加载等待最长分钟 = 10

[定时]
启用 = 是
运行时间 = 09:00
; 每天 09:00~12:00 窗口内随机时刻启动（拟人化，避开固定指纹）
最晚运行时间 = 12:00
错过补跑 = 是
仅工作日 = 否

[引擎]
优先模式 = 自动
反检测 = 是

[大模型]
智谱Key = 你的智谱APIKey（https://open.bigmodel.cn 免费申请）
免费模型 = glm-4-flashx,glm-4-flash

[通知]
企微Webhook = https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=你的key
通知开关 = 是

[复盘]
开关 = 是
观察天数 = 3
报告目录 = data/retro

[浏览器]
Profile根目录 = data/browser_profiles
浏览器路径 =
无头模式 = 否
运行结束关闭浏览器 = 是
